
<source>
  @type tail
  path /var/log/as-debug.json
  pos_file /var/log/as-debug.json.pos
  tag cyphonic.as.debug
  <parse>
    @type json
  </parse>
</source>

<source>
  @type tail
  path /var/log/as-error.json
  pos_file /var/log/as-error.json.pos
  tag cyphonic.as.error
  <parse>
    @type json
  </parse>
</source>

<match cyphonic.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix cyphonic
</match>
