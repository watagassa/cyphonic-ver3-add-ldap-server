version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: all
  disable:
    - gosec
    - revive
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
  settings:
    cyclop:
      max-complexity: 17
    depguard:
      rules:
        logger:
          files:
            - "!**/infrastructure/config/**.go"
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only by go.uber.org/zap.
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package.
            - pkg: github.com/instana/testify
              desc: It's a fork of github.com/stretchr/testify.
    funlen:
      lines: 70
    gocognit:
      min-complexity: 40
    godox:
      keywords:
        - NOTE
        - HACK
    ireturn:
      allow:
        - error
        - net.Conn
    lll:
      line-length: 185
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - err113
        text: do not define dynamic errors, use wrapped static errors instead
      - linters:
          - dupl
          - exhaustruct
          - funlen
          - ireturn
          - maintidx
          - paralleltest
          - funcorder
        path: (.+)_test\.go
      - linters:
          - exhaustruct
        path: (injector|engine)\.go
      - linters:
          - exhaustruct
        path: (injector|engine)_test\.go
      - path: (.+)\.go$
        text: "^(G102|G401|G501):"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
