{{- with .Values.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ include "nms.name" $ }}
  labels:
  {{- toYaml $.Values.commonLabels | nindent 4 }}
  {{- include "nms.selectorLabels" $ | nindent 4 }}
type: {{ .type }}
data: {{ toYaml .data | nindent 4 }}
{{- end }}
