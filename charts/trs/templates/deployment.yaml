{{- with .Values.deployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trs.name" $ }}
  namespace: {{ include "trs.name" $ }}
  labels:
  {{- toYaml $.Values.commonLabels | nindent 4 }}
  {{- include "trs.selectorLabels" $ | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .revisionHistoryLimit }}
  strategy: {{ toYaml .strategy | nindent 4 }}
  selector:
    matchLabels:
    {{- toYaml $.Values.commonLabels | nindent 6 }}
    {{- include "trs.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      labels:
      {{- toYaml $.Values.commonLabels | nindent 8 }}
      {{- include "trs.selectorLabels" $ | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .terminationGracePeriodSeconds }}
      {{- with .containers }}
      containers:
        {{- with .trs }}
        - name: {{ .name }}
          image: {{ include "trs.image" $ }}
          imagePullPolicy: {{ .imagePullPolicy }}
          ports: {{ toYaml .ports | nindent 12 }}
          resources: {{ toYaml .resources | nindent 12 }}
          startupProbe: {{ toYaml .startupProbe | nindent 12 }}
          readinessProbe: {{ toYaml .readinessProbe | nindent 12 }}
          livenessProbe: {{ toYaml .livenessProbe | nindent 12 }}
          lifecycle: {{ toYaml .lifecycle | nindent 12 }}
          volumeMounts: {{ toYaml .volumeMounts | nindent 12 }}
          envFrom: {{ toYaml .envFrom | nindent 12 }}
        {{- end }}
      {{- end }}
{{- end }}
