name: ci

on:
  push:
    branches:
      - "main"
      - "releases/**"

jobs:
  build-and-push:
    name: Push docker image to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set GitHubCommitHash to env
        run: |
          echo "SHA8=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: AS image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.docker/as/Dockerfile.production
          push: true
          tags: pluslab/cyphonic-asd:${{ env.SHA8 }}

      - name: NMS image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.docker/nms/Dockerfile.production
          push: true
          tags: pluslab/cyphonic-nmsd:${{ env.SHA8 }}

      - name: TRS image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.docker/trs/Dockerfile.production
          push: true
          tags: pluslab/cyphonic-trsd:${{ env.SHA8 }}

      - name: Controller API image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.docker/controller/Dockerfile.production
          push: true
          tags: pluslab/cyphonic-controller-api:${{ env.SHA8 }}

      - name: Web Controller image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.docker/web/Dockerfile.production
          push: true
          tags: pluslab/cyphonic-web:${{ env.SHA8 }}

      - name: U-NS image build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.docker/u-ns/Dockerfile.production
          push: true
          tags: pluslab/cyphonic-u-nsd:${{ env.SHA8 }}
