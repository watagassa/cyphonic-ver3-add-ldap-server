linters-settings:
  lll:
    line-length: 185
  funlen:
    lines: 70
  cyclop:
    max-complexity: 17
  gocognit:
    min-complexity: 40
  godox:
    keywords:
      - NOTE
      - HACK
  ireturn:
    allow:
      - error
      - github.com/Pluslab/cyphonic/controller/api/driver.ListenAndServe
      - github.com/Pluslab/cyphonic/controller/api/usecases/port.OutputPort
      - github.com/Pluslab/cyphonic/controller/api/usecases/port.InputPort
      - github.com/Pluslab/cyphonic/controller/api/usecases/port.Repository
      - github.com/Pluslab/cyphonic/controller/api/adapter/gateway.GormClientFactory
      - github.com/Pluslab/cyphonic/controller/api/adapter/controller.ListenAndServe
      - github.com/Pluslab/cyphonic/controller/api/usecases/port.InputPort
  tagliatelle:
    case:
      use-field-name: true
      rules:
        json: snake

run:
  tests: true
  allow-parallel-runners: true
linters:
  enable-all: true
  disable:
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
    - revive
    - gosec
    - exportloopref
    # TODO: remove under linters
    - funlen 
    - godot
    - govet
    - lll
    - unconvert
    - copyloopvar
    - depguard
    - errorlint
    - err113
    - exhaustruct
    - inamedparam
    - ireturn
    - mnd
    - nlreturn
    - perfsprint
    - tagalign
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl

issues:
  exclude:
    - "^(G102|G401|G501):"
  exclude-rules:
    - linters: [goerr113]
      text: "do not define dynamic errors, use wrapped static errors instead" # This rule to avoid opinionated check fmt.Errorf("text")
    - path: '(.+)_test\.go'
      linters:
        - maintidx
        - funlen
        - dupl
